<html>
  <head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-plane src="grass.jpeg" repeat="20 20" position="0 0 -4" rotation="-90 0 0" width="100" height="100"></a-plane>
      <a-sky src="sky.jpg"></a-sky>
      
      <a-cylinder src="tire.png" position="0 0.8 -3" radius="0.75" rotation="90 0 0"></a-cylinder>
      <a-cylinder src="tire.png" position="4 0.8 -3" radius="0.75" rotation="90 0 0"></a-cylinder>
      <a-cylinder src="tire.png" position="0 0.8 0" radius="0.75" rotation="90 0 0"></a-cylinder>
      <a-cylinder src="tire.png" position="4 0.8 0" radius="0.75" rotation="90 0 0"></a-cylinder>

      <a-box position="2 2 -1.5" depth="5" width="8.5" height="2" color="blue"></a-box>
      <a-cylinder position="2 3 -1.5" rotation="0 0 90" radius="2" width="4" height="4" color="blue"></a-cylinder>
      <a-box position="-1.75 3.5 -1.5" depth="5" height="1" color="black"></a-box>
      
      <a-plane position="4.1 3 -1.5" rotation="0 90 0" width="3" height="2.5" color="white"></a-plane>
      <a-plane position="2 3 0.6" rotation="-14 0 0" width="3" height="2.5" color="white"></a-plane>
      <a-plane position="2 3 -3.6" rotation="-14 180 0" width="3" height="2.5" color="white"></a-plane>

      <a-circle src="lights.webp" position="6.3 2 0" rotation="0 90 0" radius="0.35"></a-circle>
      <a-circle src="lights.webp" position="6.3 2 -3" rotation="0 90 0" radius="0.35"></a-circle>


      <a-camera position="0 3 5"></a-camera>
    </a-scene>
  </body>
</html>
