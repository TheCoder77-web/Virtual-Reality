<html>
  <head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <img id="brick" src="brick.png"/>
      </a-assets>

      <a-entity class="room" id="house" position="0 0 0">
            <a-entity class="wall">
                <a-box width="2" height="8" depth="0.1" position="-2 1.5 0" src="#brick" repeat="2 3"></a-box>
                <a-box width="2" height="8" depth="0.1" position="2 1.5 0" src="#brick" repeat="2 3"></a-box>
                <a-box width="2" height="1" depth="0.1" position="0 0.5 0" src="#brick" repeat="2 1"></a-box>
                <a-box width="2" height="1" depth="0.1" position="0 3 0" src="#brick" repeat="2 1"></a-box>
                <a-box width="2" height="1.5" depth="0.1" color="blue" opacity="0.2" position="0 1.75 0" ></a-box>
                <a-box width="2" height="1.5" depth="0.1" color="blue" opacity="0.2" position="0 4.25 0" ></a-box>
            </a-entity>
            <a-entity class="wall" position="6 0 0">
                <a-box width="2" height="8" depth="0.1" position="-2 1.5 0" src="#brick" repeat="2 3"></a-box>
                <a-box width="2" height="8" depth="0.1" position="2 1.5 0" src="#brick" repeat="2 3"></a-box>
                <a-box width="2" height="1" depth="0.1" position="0 0.5 0" src="#brick" repeat="2 1"></a-box>
                <a-box width="2" height="1" depth="0.1" position="0 3 0" src="#brick" repeat="2 1"></a-box>
                <a-box width="2" height="1.5" depth="0.1" color="blue" opacity="0.2" position="0 1.75 0" ></a-box>
                <a-box width="2" height="1.5" depth="0.1" color="blue" opacity="0.2" position="0 4.25 0" ></a-box>
            </a-entity>
            <a-entity class="wall" rotation="0 90 0" position="-3 0 -3">
                <a-box width="2" height="8" depth="0.1" position="-2 1.5 0" src="#brick" repeat="2 3"></a-box>
                <a-box width="2" height="8" depth="0.1" position="2 1.5 0" src="#brick" repeat="2 3"></a-box>
                <a-box width="2" height="1" depth="0.1" position="0 0.5 0" src="#brick" repeat="2 1"></a-box>
                <a-box width="2" height="1" depth="0.1" position="0 3 0" src="#brick" repeat="2 1"></a-box>
                <a-box width="2" height="1.5" depth="0.1" color="blue" opacity="0.2" position="0 1.75 0" ></a-box>
                <a-box width="2" height="1.5" depth="0.1" color="blue" opacity="0.2" position="0 4.25 0" ></a-box>
            </a-entity>
            <a-entity class="wall" rotation="0 90 0" position="-3 0 -9">
                <a-box width="2" height="8" depth="0.1" position="-2 1.5 0" src="#brick" repeat="2 3"></a-box>
                <a-box width="2" height="8" depth="0.1" position="2 1.5 0" src="#brick" repeat="2 3"></a-box>
                <a-box width="2" height="1" depth="0.1" position="0 0.5 0" src="#brick" repeat="2 1"></a-box>
                <a-box width="2" height="1" depth="0.1" position="0 3 0" src="#brick" repeat="2 1"></a-box>
                <a-box width="2" height="1.5" depth="0.1" color="blue" opacity="0.2" position="0 1.75 0" ></a-box>
                <a-box width="2" height="1.5" depth="0.1" color="blue" opacity="0.2" position="0 4.25 0" ></a-box>
            </a-entity>
            <a-entity class="wall" position="0 0 -12">
                <a-box width="2" height="8" depth="0.1" position="-2 1.5 0" src="#brick" repeat="2 3"></a-box>
                <a-box width="2" height="8" depth="0.1" position="2 1.5 0" src="#brick" repeat="2 3"></a-box>
                <a-box width="2" height="8" depth="0.1" position="0 1.5 0" src="#brick" repeat="2 3"></a-box>
            </a-entity>
            <a-entity class="wall" position="6 0 -12">
                <a-box width="2" height="8" depth="0.1" position="-2 1.5 0" src="#brick" repeat="2 3"></a-box>
                <a-box width="2" height="8" depth="0.1" position="2 1.5 0" src="#brick" repeat="2 3"></a-box>
                <a-box width="2" height="8" depth="0.1" position="0 1.5 0" src="#brick" repeat="2 3"></a-box>
            </a-entity>
            <a-entity class="wall" rotation="0 90 0" position="9 0 -3">
                <a-box width="2" height="8" depth="0.1" position="-2 1.5 0" src="#brick" repeat="2 3"></a-box>
                <a-box width="2" height="8" depth="0.1" position="2 1.5 0" src="#brick" repeat="2 3"></a-box>
                <a-box width="2" height="1" depth="0.1" position="0 0.5 0" src="#brick" repeat="2 1"></a-box>
                <a-box width="2" height="1" depth="0.1" position="0 3 0" src="#brick" repeat="2 1"></a-box>
                <a-box width="2" height="1.5" depth="0.1" color="blue" opacity="0.2" position="0 1.75 0" ></a-box>
                <a-box width="2" height="1.5" depth="0.1" color="blue" opacity="0.2" position="0 4.25 0" ></a-box>
            </a-entity>
            <a-entity class="wall" rotation="0 90 0" position="9 0 -9">
                <a-box width="2" height="8" depth="0.1" position="-2 1.5 0" src="#brick" repeat="2 3"></a-box>
                <a-box width="2" height="8" depth="0.1" position="2 1.5 0" src="#brick" repeat="2 3"></a-box>
                <a-box width="2" height="1" depth="0.1" position="0 0.5 0" src="#brick" repeat="2 1"></a-box>
                <a-box width="2" height="1" depth="0.1" position="0 3 0" src="#brick" repeat="2 1"></a-box>
                <a-box width="2" height="1.5" depth="0.1" color="blue" opacity="0.2" position="0 1.75 0" ></a-box>
                <a-box width="2" height="1.5" depth="0.1" color="blue" opacity="0.2" position="0 4.25 0" ></a-box>
            </a-entity>
            <a-entity position="0 3 0">
                <a-cone segments-radial="4" height="5" radius-bottom="10" position="3 4.5 -6" rotation="0 45 0" material="color: #333333; repeat: 4 6">
                </a-cone>
            </a-entity>
      </a-entity>
      
      <a-plane position="0 0 0" rotation="-90 0 0" width="100" height="100" color="#7BC8A4"></a-plane>
      <a-sky color="#ECECEC"></a-sky>
      <a-camera position="0 4 5"></a-camera>
    </a-scene>
  </body>
</html>
